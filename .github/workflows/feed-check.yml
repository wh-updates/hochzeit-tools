name: Feed-Prüfung
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_feeds.py
      - name: Bericht speichern
        run: |
          git config user.name "feed-check"
          git config user.email "feed-check@users.noreply.github.com"
          git add marketing/feed-bericht.md marketing/feeds-geprueft.json
          git diff --cached --quiet || git commit -m "Feed-Prüfung aktualisiert"
          git push
